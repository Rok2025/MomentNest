# Initial HTTP config. Certbot adds HTTPS once DNS resolves to this server.
server {
    listen 80;
    listen [::]:80;
    server_name nest.rokzhang.cn;
    client_max_body_size 1g;
    client_body_timeout 900s;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = /media/object {
        proxy_pass http://127.0.0.1:3211/object;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signed URLs must not be written to access logs.
        access_log off;
    }
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 90s;
        # Auth confirmation URLs can carry tokens as query parameters.
        access_log off;
    }
}
